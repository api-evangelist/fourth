aid: fourth
name: Fourth
description: >-
  Fourth is an AI-powered workforce management and inventory platform built for
  restaurants and hospitality, uniting recruiting, HR, payroll, labor scheduling,
  purchasing, and inventory management in a single system across 120,000+ locations
  globally (customers include Taco Bell, Dunkin', KFC, Pizza Hut and Culver's).
  Its product family includes HotSchedules for scheduling, Fourth iQ for restaurant
  performance, Human Capital Management for talent and payroll, and Adaco inventory
  for hotels. Fourth publishes a developer portal of REST APIs covering POS
  transactions, recipe & menu engineering, menu cycles, workforce (UK employee,
  labor productivity, schedules), notifications, tasks, SCIM identity provisioning,
  and Adaco hotel inventory. APIs authenticate with OAuth 2.0 (client_credentials
  and password grants) or Basic Auth; production and test host locations are
  provisioned per mutual customer and are not publicly disclosed.
